# Holiday calendar (IST). Add holidays per region/team.
# The system uses the calendar `default_calendar_id` from config.yaml.
# A project can override via its `holiday_calendar_id` field.
#
# Format per holiday: a date (YYYY-MM-DD) plus a name.
# A holiday WEEK (a week containing any of these dates) auto-skips weekly
# aggregation per FR §B.7.3.

calendars:
  default:
    description: "India national holidays + corporate holidays for 2026 (FILL ME IN)"
    holidays:
      - date: "2026-01-26"
        name: "Republic Day"
      - date: "2026-08-15"
        name: "Independence Day"
      - date: "2026-10-02"
        name: "Gandhi Jayanti"
      - date: "2026-12-25"
        name: "Christmas Day"
      # FILL: add company holidays, regional holidays, etc.

  # Add additional calendars per region/team if needed.
  # Example:
  # bengaluru:
  #   description: "Bengaluru office holidays 2026"
  #   holidays:
  #     - date: "2026-04-14"
  #       name: "Tamil New Year"
