[project]
name = "project-manager-app"
version = "0.1.0"
description = "AI-assisted project-management tool for PGM (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4.0",   # 4.x changed the Job API (next_run_time → next_fire_time) + scheduler architecture; pin to 3.x
    "pydantic>=2.6",
    "requests>=2.31",
    "urllib3>=2.0",
    "ollama>=0.1.7",
    "openai>=1.12",
    "click>=8.1",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "numpy>=1.26",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",                # Phase 2 (W1): server-rendered HTML templates
    "markdown>=3.5",              # Phase 2 (W4): render WeeklyReport.content_markdown to HTML
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "responses>=0.25",
    "ruff>=0.3",
]

[project.scripts]
project-manager = "manage:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
